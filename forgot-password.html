<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - BookNest</title>
  
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/logo.svg" alt="BookNest Logo" />
        <span>BookNest</span>
      </a>
      <a href="login.html" class="btn btn-ghost btn-sm">Back to Login</a>
    </div>
  </header>

  <!-- Forgot Password Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="badge badge-primary mb-2">Account Recovery</div>
        <h1>Forgot Password</h1>
        <p>Enter your registered college email address to receive a secure password reset link.</p>
      </div>

      <form id="forgot-password-form">
        <div class="form-group mb-4">
          <label class="form-label">Registered Email Address <span class="required">*</span></label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="reset-email" class="form-control" placeholder="student@college.edu" required />
          </div>
        </div>

        <button type="submit" id="btn-send-reset" class="btn btn-primary btn-block btn-lg mb-3">
          Send Password Reset Link
        </button>

        <div class="text-center" style="font-size: 0.9rem; color: var(--color-text-muted);">
          Remembered your password? <a href="login.html" style="font-weight: 700; color: var(--color-primary);">Login here</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/config/firebase-config.js"></script>
  <script src="js/services/seed-service.js"></script>
  <script src="js/config/data-store.js"></script>
  <script src="js/auth/auth.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/utils/router.js"></script>

  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('btn-send-reset');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Sending Reset Link...';

      try {
        await BookNestAuth.sendPasswordReset(email);
        sessionStorage.setItem('booknest_reset_email', email);
        window.location.href = 'reset-success.html';
      } catch (err) {
        BookNestUI.showToast(err.message || 'Failed to send reset link.', 'error');
        btn.disabled = false;
        btn.textContent = 'Send Password Reset Link';
      }
    });
  </script>
</body>
</html>
